# Managed by the SlickHood backend production deployment.
#
# Nginx keeps the small per-connection buffer at its conservative default and
# allocates these larger buffers only when a request header does not fit. Each
# field must fit in one 32 KiB buffer and a request may use up to four of those
# buffers. The backend Tomcat connector separately enforces a 32 KiB aggregate
# request-header ceiling. This accommodates the frontend's explicitly capped
# 14 KB access token.
client_header_buffer_size 1k;
large_client_header_buffers 4 32k;
