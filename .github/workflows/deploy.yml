name: Build and Deploy PMS to RHEL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slickhood-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify --file pom.xml

      - name: Verify immutable artifact revision
        shell: bash
        run: |
          set -euo pipefail
          unzip -p target/silverocean-0.0.1-SNAPSHOT.jar BOOT-INF/classes/git.properties | grep -Fx "git.commit.id=$GITHUB_SHA"
          unzip -p target/silverocean-0.0.1-SNAPSHOT.jar BOOT-INF/classes/git.properties | grep -Fx 'git.dirty=false'

      - name: Reject destructive or duplicate Flyway migrations
        shell: bash
        run: |
          set -euo pipefail
          destructive="$(grep -Eirl '\b(DROP[[:space:]]+(TABLE|COLUMN|DATABASE)|TRUNCATE[[:space:]]+TABLE|RENAME[[:space:]]+TABLE)\b' src/main/resources/db/migration || true)"
          unexpected="$(printf '%s\n' "$destructive" | sed '/^$/d' | grep -Fvx -f .github/destructive-migration-allowlist.txt || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            echo "Destructive migrations require an explicitly reviewed expand/contract release plan." >&2
            exit 1
          fi
          duplicates="$(find src/main/resources/db/migration -type f -name 'V*__*.sql' -printf '%f\n' | sed -E 's/^V([^_]+)__.*/\1/' | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate Flyway versions: $duplicates" >&2; exit 1; }

      - name: Create release checksum
        run: |
          install -m 0755 scripts/production-preflight.py target/production-preflight.py
          install -m 0755 scripts/production-backup.py target/production-backup.py
          cd target
          sha256sum -- *.jar production-preflight.py production-backup.py > release.sha256

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar,target/release.sha256,target/production-preflight.py,target/production-backup.py"
          target: /tmp/slickhood-backend-release
          strip_components: 1

      - name: Install, verify and roll back on failure
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PAYSTACK_TEST_SECRET_KEY
          command_timeout: 10m
          script: |
            set -eu
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            live=/home/silverocean/backend/silverocean-0.0.1-SNAPSHOT.jar
            candidate=/tmp/slickhood-backend-release/silverocean-0.0.1-SNAPSHOT.jar
            rollback="/home/silverocean/backups/backend-$stamp.jar"
            health_url='${{ secrets.BACKEND_HEALTHCHECK_URL }}'
            preflight=/tmp/slickhood-backend-release/production-preflight.py
            public_origin=https://app.slickhood.com
            expected_bucket=slickhood-production-documents-603455138904-ca-central-1-an
            expected_region=ca-central-1
            whatsapp_env=""
            whatsapp_dropin=""
            paystack_env=""
            paystack_dropin=""
            paystack_curl_config=""
            paystack_probe=""
            test -n "$health_url"
            test -f "$preflight"
            case "$health_url" in
              */actuator/health/production-readiness) ;;
              *) echo "BACKEND_HEALTHCHECK_URL must target /actuator/health/production-readiness" >&2; exit 1 ;;
            esac
            installed=false
            wait_for_health() {
              for attempt in $(seq 1 36); do
                if curl --fail --silent --show-error "$health_url" | grep -q '"status":"UP"'; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }
            report_safe_failure_diagnostics() {
              echo 'Candidate service state'
              sudo systemctl show pms.service \
                --property=ActiveState,SubState,Result,NRestarts,ExecMainCode,ExecMainStatus,DropInPaths
              echo 'Candidate production readiness (configuration names only)'
              readiness_file="$(mktemp)"
              curl --silent --show-error --output "$readiness_file" "$health_url" || true
              python3 - "$readiness_file" <<'PY'
            import json
            import sys

            try:
                with open(sys.argv[1], encoding="utf-8") as source:
                    payload = json.load(source)
                component = payload.get("components", {}).get("productionReadiness", {})
                details = component.get("details", {})
                print("overallStatus=" + str(payload.get("status", "UNKNOWN")))
                print("productionReadinessStatus=" + str(component.get("status", "UNKNOWN")))
                print("whatsappStatus=" + str(details.get("whatsappStatus", "unknown")))
                missing = details.get("missingOrUnsafeConfiguration", [])
                if isinstance(missing, list):
                    print("missingOrUnsafeConfiguration=" + ",".join(str(item) for item in missing))
                else:
                    print("missingOrUnsafeConfiguration=unavailable")
            except Exception:
                print("productionReadinessResponse=unavailable")
            PY
              rm -f "$readiness_file"
              echo 'Candidate Java exception classes (names only)'
              sudo journalctl -u pms.service --since '10 minutes ago' --no-pager \
                | grep -Eo '([A-Za-z_][A-Za-z0-9_$]*\.)+[A-Za-z_][A-Za-z0-9_$]*(Exception|Error)' \
                | sort \
                | uniq -c \
                | tail -n 80 || true
            }
            restore_previous_release() {
              if [ "$installed" = "true" ] && sudo test -f "$rollback"; then
                sudo install -o silverocean -g silverocean -m 0644 "$rollback" "$live"
                sudo systemctl restart pms.service
                if ! wait_for_health; then
                  echo "Rollback release failed to become healthy" >&2
                  sudo systemctl status pms.service --no-pager || true
                  return 1
                fi
                echo "Previous release restored and healthy"
              fi
            }
            cleanup() {
              status=$?
              trap - EXIT
              test -z "$whatsapp_env" || rm -f "$whatsapp_env"
              test -z "$whatsapp_dropin" || rm -f "$whatsapp_dropin"
              test -z "$paystack_env" || rm -f "$paystack_env"
              test -z "$paystack_dropin" || rm -f "$paystack_dropin"
              test -z "$paystack_curl_config" || rm -f "$paystack_curl_config"
              test -z "$paystack_probe" || rm -f "$paystack_probe"
              if [ "$status" -ne 0 ]; then
                restore_previous_release || status=1
              fi
              release_staging=/tmp/slickhood-backend-release
              test "$release_staging" = /tmp/slickhood-backend-release
              if [ -e "$release_staging" ]; then
                test ! -L "$release_staging"
                sudo rm -rf -- "$release_staging"
              fi
              exit "$status"
            }
            run_preflight() {
              required_version="$1"
              whatsapp_status="${2:-}"
              whatsapp_args=""
              insurance_args=""
              if [ "${3:-}" = "require-insurance" ]; then
                insurance_args="--require-public-insurance-cors"
              fi
              if [ -n "$whatsapp_status" ]; then
                whatsapp_args="--expected-whatsapp-status $whatsapp_status"
              fi
              sudo python3 "$preflight" \
                --readiness-url "$health_url" \
                --public-origin "$public_origin" \
                --expected-flyway-version "$required_version" \
                --expected-bucket "$expected_bucket" \
                --expected-region "$expected_region" \
                $whatsapp_args $insurance_args
            }
            trap cleanup EXIT
            cd /tmp/slickhood-backend-release
            sha256sum -c release.sha256
            test -f "$candidate"
            # Validate the already-deployed compatibility baseline before the
            # candidate JAR has had a chance to apply its new migrations.
            # V96 may already be present after a rollback because Flyway
            # migrations are forward-only. Validate the current production
            # baseline before replacing the application binary.
            run_preflight 96
            # Backup contents never leave the host or appear in workflow logs.
            sudo python3 /tmp/slickhood-backend-release/production-backup.py
            test -n "$PAYSTACK_TEST_SECRET_KEY"
            paystack_curl_config="$(mktemp)"
            paystack_probe="$(mktemp)"
            chmod 0600 "$paystack_curl_config" "$paystack_probe"
            printf 'header = "Authorization: Bearer %s"\n' "$PAYSTACK_TEST_SECRET_KEY" >"$paystack_curl_config"
            paystack_http="$(curl --silent --show-error --output "$paystack_probe" --write-out '%{http_code}' \
              --config "$paystack_curl_config" https://api.paystack.co/transaction/totals || true)"
            rm -f "$paystack_curl_config" "$paystack_probe"
            paystack_curl_config=""
            paystack_probe=""
            if [ "$paystack_http" = 200 ]; then
              echo 'Paystack test credential accepted from the production host'
              umask 077
              paystack_env="$(mktemp)"
              {
                printf 'PAYMENT_PAYSTACK_ENABLED=false\n'
                printf 'PAYMENT_PAYSTACK_SECRET_KEY=%s\n' "$PAYSTACK_TEST_SECRET_KEY"
                printf 'PAYMENT_PAYSTACK_API_URL=https://api.paystack.co\n'
                printf 'PAYMENT_PAYSTACK_CALLBACK_URL=https://app.slickhood.com/payment/callback\n'
                printf 'PAYMENT_PAYSTACK_CURRENCY=KES\n'
                printf 'PAYMENT_PAYSTACK_SUPPORTED_CURRENCIES=KES,USD,NGN,GHS,ZAR\n'
                printf 'PAYMENT_PAYSTACK_CHANNELS=card,mobile_money\n'
                printf 'PAYMENT_PAYSTACK_FEE_BEARER=subaccount\n'
              } >"$paystack_env"
              sudo install -d -o root -g root -m 0700 /etc/slickhood/secrets
              sudo install -o root -g root -m 0600 "$paystack_env" /etc/slickhood/secrets/paystack.env
              rm -f "$paystack_env"
              paystack_env=""
              paystack_dropin="$(mktemp)"
              printf '[Service]\nEnvironmentFile=/etc/slickhood/secrets/paystack.env\n' >"$paystack_dropin"
              sudo install -d -o root -g root -m 0755 /etc/systemd/system/pms.service.d
              sudo install -o root -g root -m 0644 "$paystack_dropin" /etc/systemd/system/pms.service.d/paystack.conf
              rm -f "$paystack_dropin"
              paystack_dropin=""
            else
              echo "Paystack remains disabled; staged sandbox credential was rejected from the production host (HTTP $paystack_http)" >&2
              echo 'Retaining the existing disabled Paystack configuration; provider activation remains blocked'
            fi
            umask 077
            whatsapp_env="$(mktemp)"
            {
              printf 'WHATSAPP_ENABLED=false\n'
              printf 'WHATSAPP_TEMPLATES_BILLING_APPROVED=false\n'
              printf 'WHATSAPP_TEMPLATES_PROPERTY_APPROVED=false\n'
              printf 'WHATSAPP_TEMPLATES_MARKETPLACE_DELIVERY_APPROVED=false\n'
              printf 'WHATSAPP_TEMPLATES_SECURITY_APPROVED=false\n'
              printf 'WHATSAPP_TEMPLATES_MARKETING_APPROVED=false\n'
            } >"$whatsapp_env"
            sudo install -d -o root -g root -m 0700 /etc/slickhood/secrets
            sudo install -o root -g root -m 0600 "$whatsapp_env" /etc/slickhood/secrets/whatsapp.env
            rm -f "$whatsapp_env"
            whatsapp_env=""
            whatsapp_dropin="$(mktemp)"
            printf '[Service]\nEnvironmentFile=/etc/slickhood/secrets/whatsapp.env\n' >"$whatsapp_dropin"
            sudo install -d -o root -g root -m 0755 /etc/systemd/system/pms.service.d
            sudo install -o root -g root -m 0644 "$whatsapp_dropin" /etc/systemd/system/pms.service.d/whatsapp.conf
            rm -f "$whatsapp_dropin"
            whatsapp_dropin=""
            sudo systemctl daemon-reload
            sudo mkdir -p /home/silverocean/backups
            sudo cp "$live" "$rollback"
            sudo install -o silverocean -g silverocean -m 0644 "$candidate" "$live"
            installed=true
            sudo systemctl restart pms.service
            if wait_for_health; then
              run_preflight 97 on-hold require-insurance
              curl --fail --silent --show-error https://app.slickhood.com/api/deployed-hash | python3 -c 'import json,sys; p=json.load(sys.stdin); expected="${{ github.sha }}"; assert any(d.get("hash") in (expected, expected[:7]) for d in p.get("data", [])), "Deployed revision mismatch"'
              installed=false
              exit 0
            fi
            report_safe_failure_diagnostics
            exit 1
