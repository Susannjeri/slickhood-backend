name: Build and Deploy PMS to RHEL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slickhood-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify --file pom.xml

      - name: Require Docker-backed MySQL integration coverage
        shell: bash
        run: |
          set -euo pipefail
          for test_class in RentalPaymentMySqlIT FlywayMigrationMySqlIT; do
            report="target/failsafe-reports/TEST-org.pms.silverocean.database.${test_class}.xml"
            test -f "$report" || { echo "Required ${test_class} report is missing." >&2; exit 1; }
            skipped="$(sed -n 's/.*skipped="\([0-9][0-9]*\)".*/\1/p' "$report" | head -n 1)"
            test "${skipped:-1}" = "0" || { echo "${test_class} was skipped; Docker/MySQL validation is mandatory." >&2; exit 1; }
          done

      - name: Reject destructive or duplicate Flyway migrations
        shell: bash
        run: |
          set -euo pipefail
          destructive="$(grep -Eirl '\b(DROP[[:space:]]+(TABLE|COLUMN|DATABASE)|TRUNCATE[[:space:]]+TABLE|RENAME[[:space:]]+TABLE)\b' src/main/resources/db/migration || true)"
          unexpected="$(printf '%s\n' "$destructive" | sed '/^$/d' | grep -Fvx -f .github/destructive-migration-allowlist.txt || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            echo "Destructive migrations require an explicitly reviewed expand/contract release plan." >&2
            exit 1
          fi
          duplicates="$(find src/main/resources/db/migration -type f -name 'V*__*.sql' -printf '%f\n' | sed -E 's/^V([^_]+)__.*/\1/' | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate Flyway versions: $duplicates" >&2; exit 1; }

      - name: Create release checksum
        run: cd target && sha256sum -- *.jar > release.sha256

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar,target/release.sha256"
          target: /tmp/slickhood-backend-release
          strip_components: 1

      - name: Install, verify and roll back on failure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            live=/home/silverocean/backend/silverocean-0.0.1-SNAPSHOT.jar
            candidate=/tmp/slickhood-backend-release/silverocean-0.0.1-SNAPSHOT.jar
            rollback="/home/silverocean/backups/backend-$stamp.jar"
            health_url='${{ secrets.BACKEND_HEALTHCHECK_URL }}'
            test -n "$health_url"
            case "$health_url" in
              https://*/actuator/health/production-readiness) ;;
              *) echo "BACKEND_HEALTHCHECK_URL must be HTTPS and target /actuator/health/production-readiness" >&2; exit 1 ;;
            esac
            base_health_url="${health_url%/production-readiness}"
            installed=false
            wait_for_health() {
              url="$1"
              for attempt in $(seq 1 36); do
                if curl --fail --silent --show-error "$url" | grep -q '"status":"UP"'; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }
            restore_previous_release() {
              if [ "$installed" = "true" ] && sudo test -f "$rollback"; then
                sudo install -o silverocean -g silverocean -m 0644 "$rollback" "$live"
                sudo systemctl restart pms.service
                if ! wait_for_health "$base_health_url"; then
                  echo "Rollback release failed to become healthy" >&2
                  sudo systemctl status pms.service --no-pager || true
                  return 1
                fi
                echo "Previous release restored and healthy"
              fi
            }
            cleanup() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                restore_previous_release || status=1
              fi
              exit "$status"
            }
            trap cleanup EXIT
            cd /tmp/slickhood-backend-release
            sha256sum -c release.sha256
            test -f "$candidate"
            sudo mkdir -p /home/silverocean/backups
            sudo cp "$live" "$rollback"
            sudo install -o silverocean -g silverocean -m 0644 "$candidate" "$live"
            installed=true
            sudo systemctl restart pms.service
            if wait_for_health "$health_url"; then
              installed=false
              exit 0
            fi
            sudo systemctl status pms.service --no-pager || true
            exit 1
