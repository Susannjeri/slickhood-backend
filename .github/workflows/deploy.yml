name: Build and Deploy PMS to RHEL

on:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: slickhood-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B verify --file pom.xml

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          # Correctly using the secret here
          target: ${{ secrets.TARGET_DIR }}
          strip_components: 1

      - name: Restart PMS Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart pms.service
            for attempt in 1 2 3 4 5 6; do
              if curl --insecure --fail --silent --show-error https://127.0.0.1:8989/actuator/health | grep -q '"status":"UP"'; then
                exit 0
              fi
              sleep 5
            done
            sudo systemctl status pms.service --no-pager
            exit 1
