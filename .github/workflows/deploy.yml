name: Build and Deploy PMS to RHEL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slickhood-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify --file pom.xml

      - name: Reject destructive or duplicate Flyway migrations
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eir '\b(DROP[[:space:]]+(TABLE|COLUMN|DATABASE)|TRUNCATE[[:space:]]+TABLE|RENAME[[:space:]]+TABLE)\b' src/main/resources/db/migration; then
            echo "Destructive migrations require an explicitly reviewed expand/contract release plan." >&2
            exit 1
          fi
          duplicates="$(find src/main/resources/db/migration -type f -name 'V*__*.sql' -printf '%f\n' | sed -E 's/^V([^_]+)__.*/\1/' | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate Flyway versions: $duplicates" >&2; exit 1; }

      - name: Create release checksum
        run: cd target && sha256sum -- *.jar > release.sha256

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar,target/release.sha256"
          target: /tmp/slickhood-backend-release
          strip_components: 1

      - name: Install, verify and roll back on failure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            live=/home/silverocean/backend/silverocean-0.0.1-SNAPSHOT.jar
            candidate=/tmp/slickhood-backend-release/silverocean-0.0.1-SNAPSHOT.jar
            rollback="/home/silverocean/backups/backend-$stamp.jar"
            installed=false
            restore_previous_release() {
              if [ "$installed" = "true" ] && [ -f "$rollback" ]; then
                sudo install -o silverocean -g silverocean -m 0644 "$rollback" "$live"
                sudo systemctl restart pms.service || true
              fi
            }
            cleanup() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                restore_previous_release
              fi
              exit "$status"
            }
            trap cleanup EXIT
            cd /tmp/slickhood-backend-release
            sha256sum -c release.sha256
            test -f "$candidate"
            sudo mkdir -p /home/silverocean/backups
            sudo cp "$live" "$rollback"
            sudo install -o silverocean -g silverocean -m 0644 "$candidate" "$live"
            installed=true
            sudo systemctl restart pms.service
            for attempt in 1 2 3 4 5 6; do
              if curl --insecure --fail --silent --show-error https://127.0.0.1:8989/actuator/health | grep -q '"status":"UP"'; then
                installed=false
                exit 0
              fi
              sleep 5
            done
            sudo systemctl status pms.service --no-pager || true
            exit 1
