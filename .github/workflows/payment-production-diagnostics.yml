name: Production Payment Diagnostics

on:
  workflow_dispatch:
    inputs:
      invoice_ref:
        description: Exact SlickHood invoice reference
        required: true
        type: string
      provider_transaction_id:
        description: Optional numeric Paystack transaction ID
        required: false
        type: string
      payment_reference:
        description: Optional numeric SlickHood payment reference for Paystack verification
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect payment state without changing it
        uses: appleboy/ssh-action@v1.0.3
        env:
          INVOICE_REF: ${{ inputs.invoice_ref }}
          PROVIDER_TRANSACTION_ID: ${{ inputs.provider_transaction_id }}
          PAYMENT_REFERENCE: ${{ inputs.payment_reference }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: INVOICE_REF,PROVIDER_TRANSACTION_ID,PAYMENT_REFERENCE
          script: |
            set -eu
            sudo INVOICE_REF="$INVOICE_REF" PROVIDER_TRANSACTION_ID="$PROVIDER_TRANSACTION_ID" PAYMENT_REFERENCE="$PAYMENT_REFERENCE" python3 - <<'PY'
            from __future__ import annotations
            import json, os, re, subprocess, urllib.request
            from pathlib import Path

            invoice_ref = os.environ.get("INVOICE_REF", "").strip()
            provider_id = os.environ.get("PROVIDER_TRANSACTION_ID", "").strip()
            payment_reference = os.environ.get("PAYMENT_REFERENCE", "").strip()
            if not re.fullmatch(r"[A-Za-z0-9_-]{1,100}", invoice_ref):
                raise RuntimeError("Invalid invoice reference")
            if provider_id and not re.fullmatch(r"[0-9]{1,30}", provider_id):
                raise RuntimeError("Invalid provider transaction ID")
            if payment_reference and not re.fullmatch(r"[0-9]{1,19}", payment_reference):
                raise RuntimeError("Invalid payment reference")

            files = (Path("/etc/slickhood/application.properties"), Path("/home/silverocean/backend/config/application.properties"))
            config = dict(os.environ)
            for path in files:
                if path.exists():
                    for raw in path.read_text(encoding="utf-8-sig").splitlines():
                        line = raw.strip()
                        if line and not line.startswith("#") and "=" in line:
                            key, value = line.split("=", 1)
                            config[key.strip()] = value.strip().strip("\"'")

            def resolve(*keys: str) -> str:
                for key in keys:
                    value = config.get(key, "").strip()
                    match = re.fullmatch(r"\$\{([^}:]+)(?::([^}]*))?}", value)
                    if match:
                        value = config.get(match.group(1), match.group(2) or "").strip()
                    if value:
                        return value
                raise RuntimeError("Required configuration is unavailable")

            jdbc = resolve("spring.datasource.url", "SPRING_DATASOURCE_URL")
            username = resolve("spring.datasource.username", "DATABASE_USERNAME", "SPRING_DATASOURCE_USERNAME")
            password = resolve("spring.datasource.password", "DATABASE_PASSWORD", "SPRING_DATASOURCE_PASSWORD")
            match = re.match(r"jdbc:mysql://([^/:?]+)(?::(\d+))?/([^?]+)", jdbc)
            if not match:
                raise RuntimeError("Unsupported datasource configuration")
            host, port, database = match.group(1), match.group(2) or "3306", match.group(3)
            mysql_env = dict(os.environ); mysql_env["MYSQL_PWD"] = password

            def mysql(query: str) -> list[str]:
                result = subprocess.run(["mysql", "--batch", "--skip-column-names", "--host", host,
                    "--port", port, "--user", username, database, "--execute", query], env=mysql_env,
                    text=True, capture_output=True, timeout=20, check=False)
                if result.returncode:
                    raise RuntimeError("Database read failed")
                return result.stdout.strip().splitlines() if result.stdout.strip() else []

            escaped = invoice_ref.replace("'", "''")
            invoices = mysql("SELECT CONCAT(id,'|',paid,'|',transaction_in_progress,'|',"
                "COALESCE(amount_decimal,amount),'|',COALESCE(pending_amount_decimal,pending_amount),'|',"
                "COALESCE(currency,''),'|',COALESCE(payment_account_id,0),'|',COALESCE(billing_type,'')) "
                f"FROM pms_invoice WHERE ref='{escaped}' LIMIT 1")
            print("matchingInvoices=" + str(len(invoices)))
            for row in invoices:
                print("invoiceState=" + row)

            payments = mysql("SELECT CONCAT(id,'|',COALESCE(channel,''),'|',COALESCE(category,''),'|',"
                "COALESCE(status,''),'|',in_progress,'|',verification_retries,'|',"
                "COALESCE(third_party_trans_id,''),'|',COALESCE(amount_decimal,amount),'|',"
                "COALESCE(currency_code,''),'|',COALESCE(status_desc,''),'|',"
                "COALESCE(DATE_FORMAT(updated_on,'%Y-%m-%dT%H:%i:%s'),'none')) "
                f"FROM pms_payment WHERE bill_reference='{escaped}' ORDER BY id DESC LIMIT 10")
            print("paymentRecords=" + str(len(payments)))
            for row in payments:
                print("paymentState=" + row)

            if provider_id or payment_reference:
                secret = resolve("payment.paystack.secret-key", "PAYSTACK_SECRET_KEY", "PAYSTACK_TEST_SECRET_KEY")
                path = "transaction/" + provider_id if provider_id else "transaction/verify/" + payment_reference
                request = urllib.request.Request("https://api.paystack.co/" + path,
                    headers={"Authorization": "Bearer " + secret, "Accept": "application/json"})
                try:
                    with urllib.request.urlopen(request, timeout=20) as response:
                        payload = json.load(response)
                except Exception as exc:
                    status = getattr(exc, "code", "none")
                    print("providerLookup=failed:" + type(exc).__name__ + ":" + str(status))
                else:
                    data = payload.get("data") or {}
                    subaccount = data.get("subaccount") or {}
                    print("providerLookup=ok")
                    print("providerStatus=" + str(data.get("status") or "missing"))
                    if payment_reference:
                        expected_rows = mysql("SELECT CONCAT(COALESCE(p.amount_decimal,p.amount),'|',"
                            "COALESCE(p.currency_code,''),'|',COALESCE(p.receiving_account_number,''),'|',"
                            "COALESCE(i.currency,'')) FROM pms_payment p JOIN pms_invoice i ON i.ref=p.bill_reference "
                            f"WHERE p.id={payment_reference} AND p.bill_reference='{escaped}' LIMIT 1")
                        if not expected_rows:
                            print("providerChecks=paymentMissing")
                        else:
                            from decimal import Decimal
                            expected_amount, expected_currency, expected_destination, invoice_currency = expected_rows[0].split("|", 3)
                            actual_subaccount = subaccount.get("subaccount_code") if isinstance(subaccount, dict) else None
                            destination_matches = (not expected_destination or expected_destination.lower() == "collection"
                                or expected_destination == "SLICKHOOD" and not actual_subaccount
                                or expected_destination == actual_subaccount)
                            checks = {
                                "referenceMatches": str(data.get("reference")) == payment_reference,
                                "domainMatches": data.get("domain") == ("test" if secret.startswith("sk_test_") else "live"),
                                "amountMatches": data.get("amount") == int(Decimal(expected_amount) * 100),
                                "currencyMatches": str(data.get("currency") or "").upper() == expected_currency.upper() == invoice_currency.upper(),
                                "destinationMatches": destination_matches,
                            }
                            print("providerChecks=" + "|".join(key + "=" + str(value).lower() for key, value in checks.items()))

            if payment_reference:
                event_rows = mysql("SELECT CONVERT(event USING utf8mb4) FROM pms_events "
                    f"WHERE t_id={payment_reference} AND event_type='PaystackVerifyResponse' ORDER BY id DESC LIMIT 1")
                if not event_rows:
                    print("storedProviderEvent=missing")
                else:
                    raw = event_rows[0]
                    def field(name: str) -> str | None:
                        match = re.search(r"(?:^|[, ])" + re.escape(name) + r"=([^,\]]*)", raw)
                        return match.group(1).strip() if match else None
                    expected_rows = mysql("SELECT CONCAT(COALESCE(p.amount_decimal,p.amount),'|',"
                        "COALESCE(p.currency_code,''),'|',COALESCE(p.receiving_account_number,''),'|',"
                        "COALESCE(i.currency,'')) FROM pms_payment p JOIN pms_invoice i ON i.ref=p.bill_reference "
                        f"WHERE p.id={payment_reference} AND p.bill_reference='{escaped}' LIMIT 1")
                    status_match = re.search(r"data=PaystackTransaction\[[^\]]*?status=([^,\]]*)", raw)
                    provider_status = status_match.group(1).strip() if status_match else None
                    print("storedProviderStatus=" + str(provider_status or "missing"))
                    if expected_rows:
                        from decimal import Decimal
                        expected_amount, expected_currency, expected_destination, invoice_currency = expected_rows[0].split("|", 3)
                        actual_destination_match = (re.search(r"subaccount=(null|MissingNode|null)", raw) is not None
                            if expected_destination == "SLICKHOOD" else expected_destination in raw)
                        stored_checks = {
                            "referenceMatches": field("reference") == payment_reference,
                            "domainMatches": field("domain") == ("test" if secret.startswith("sk_test_") else "live"),
                            "amountMatches": field("amount") == str(int(Decimal(expected_amount) * 100)),
                            "currencyMatches": str(field("currency") or "").upper() == expected_currency.upper() == invoice_currency.upper(),
                            "destinationMatches": actual_destination_match,
                        }
                        print("storedProviderChecks=" + "|".join(key + "=" + str(value).lower() for key, value in stored_checks.items()))
            PY
