name: Backend quality gate

on:
  pull_request:
  push:
    branches: ["main", "master", "release/**"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Reject destructive or duplicate Flyway migrations
        shell: bash
        run: |
          set -euo pipefail
          destructive="$(grep -Eirl '\b(DROP[[:space:]]+(TABLE|COLUMN|DATABASE)|TRUNCATE[[:space:]]+TABLE|RENAME[[:space:]]+TABLE)\b' src/main/resources/db/migration || true)"
          unexpected="$(printf '%s\n' "$destructive" | sed '/^$/d' | grep -Fvx -f .github/destructive-migration-allowlist.txt || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            echo "Destructive migrations require an explicitly reviewed expand/contract release plan." >&2
            exit 1
          fi
          duplicates="$(find src/main/resources/db/migration -type f -name 'V*__*.sql' -printf '%f\n' | sed -E 's/^V([^_]+)__.*/\1/' | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate Flyway versions: $duplicates" >&2; exit 1; }
      - name: Compile, test, and package
        run: mvn -B clean verify --file pom.xml
      - name: Require Docker-backed MySQL certification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("target/failsafe-reports/TEST-org.pms.silverocean.database.RentalPaymentMySqlIT.xml")
          if not report.is_file():
              raise SystemExit("RentalPaymentMySqlIT report is missing")
          suite = ET.parse(report).getroot()
          tests = int(suite.attrib.get("tests", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          if (tests, skipped, failures, errors) != (1, 0, 0, 0):
              raise SystemExit(
                  f"RentalPaymentMySqlIT must execute and pass: tests={tests}, "
                  f"skipped={skipped}, failures={failures}, errors={errors}"
              )
          print("RentalPaymentMySqlIT executed against Docker MySQL and passed")
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
