name: Backend quality gate

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Reject destructive or duplicate Flyway migrations
        shell: bash
        run: |
          set -euo pipefail
          destructive="$(grep -Eirl '\b(DROP[[:space:]]+(TABLE|COLUMN|DATABASE)|TRUNCATE[[:space:]]+TABLE|RENAME[[:space:]]+TABLE)\b' src/main/resources/db/migration || true)"
          unexpected="$(printf '%s\n' "$destructive" | sed '/^$/d' | grep -Fvx -f .github/destructive-migration-allowlist.txt || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected" >&2
            echo "Destructive migrations require an explicitly reviewed expand/contract release plan." >&2
            exit 1
          fi
          duplicates="$(find src/main/resources/db/migration -type f -name 'V*__*.sql' -printf '%f\n' | sed -E 's/^V([^_]+)__.*/\1/' | sort | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate Flyway versions: $duplicates" >&2; exit 1; }
      - name: Compile, test, and package
        run: mvn -B clean verify --file pom.xml
      - name: Require Docker-backed MySQL integration coverage
        shell: bash
        run: |
          set -euo pipefail
          report="target/failsafe-reports/TEST-org.pms.silverocean.database.RentalPaymentMySqlIT.xml"
          test -f "$report" || { echo "Required MySQL integration report is missing." >&2; exit 1; }
          skipped="$(sed -n 's/.*skipped="\([0-9][0-9]*\)".*/\1/p' "$report" | head -n 1)"
          test "${skipped:-1}" = "0" || { echo "RentalPaymentMySqlIT was skipped; Docker/MySQL validation is mandatory." >&2; exit 1; }
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
