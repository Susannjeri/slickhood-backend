name: Recover verified Paystack reference 216

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Recover only verified reference 216
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PAYSTACK_TEST_SECRET_KEY
          command_timeout: 3m
          script: |
            set -eu
            test -n "$PAYSTACK_TEST_SECRET_KEY"
            sudo PAYSTACK_TEST_SECRET_KEY="$PAYSTACK_TEST_SECRET_KEY" python3 - <<'PY'
            from __future__ import annotations
            import hashlib, hmac, json, os, re, subprocess, tempfile, urllib.request
            from pathlib import Path

            reference = "216"
            invoice_ref = "INV-DE4"
            secret = os.environ["PAYSTACK_TEST_SECRET_KEY"]
            curl_config = tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", delete=False)
            try:
                curl_config.write('header = "Authorization: Bearer ' + secret.replace('"', '') + '"\n')
                curl_config.close()
                os.chmod(curl_config.name, 0o600)
                verified = subprocess.run(["curl", "--silent", "--show-error", "--fail-with-body",
                    "--config", curl_config.name, "https://api.paystack.co/transaction/verify/" + reference],
                    text=True, capture_output=True, timeout=20, check=False)
                if verified.returncode:
                    raise RuntimeError("Provider verification request failed")
                payload = json.loads(verified.stdout)
            finally:
                try: os.unlink(curl_config.name)
                except FileNotFoundError: pass
            data = payload.get("data") or {}
            if payload.get("status") is not True or data.get("status") != "success":
                raise RuntimeError("Provider did not confirm success")
            if str(data.get("reference")) != reference or data.get("domain") != "test":
                raise RuntimeError("Provider reference or domain mismatch")
            if data.get("amount") != 500 or str(data.get("currency") or "").upper() != "KES":
                raise RuntimeError("Provider amount or currency mismatch")
            subaccount = data.get("subaccount") or {}
            if isinstance(subaccount, dict) and subaccount.get("subaccount_code"):
                raise RuntimeError("Unexpected provider destination")

            files = (Path("/etc/slickhood/application.properties"), Path("/home/silverocean/backend/config/application.properties"))
            config = dict(os.environ)
            for path in files:
                if path.exists():
                    for raw in path.read_text(encoding="utf-8-sig").splitlines():
                        line = raw.strip()
                        if line and not line.startswith("#") and "=" in line:
                            key, value = line.split("=", 1)
                            config[key.strip()] = value.strip().strip("\"'")
            def resolve(*keys: str) -> str:
                for key in keys:
                    value = config.get(key, "").strip()
                    match = re.fullmatch(r"\$\{([^}:]+)(?::([^}]*))?}", value)
                    if match:
                        value = config.get(match.group(1), match.group(2) or "").strip()
                    if value:
                        return value
                raise RuntimeError("Required datasource configuration is unavailable")
            jdbc = resolve("spring.datasource.url", "SPRING_DATASOURCE_URL")
            username = resolve("spring.datasource.username", "DATABASE_USERNAME", "SPRING_DATASOURCE_USERNAME")
            password = resolve("spring.datasource.password", "DATABASE_PASSWORD", "SPRING_DATASOURCE_PASSWORD")
            match = re.match(r"jdbc:mysql://([^/:?]+)(?::(\d+))?/([^?]+)", jdbc)
            if not match:
                raise RuntimeError("Unsupported datasource configuration")
            host, port, database = match.group(1), match.group(2) or "3306", match.group(3)
            mysql_env = dict(os.environ); mysql_env["MYSQL_PWD"] = password
            def mysql(query: str) -> list[str]:
                result = subprocess.run(["mysql", "--batch", "--skip-column-names", "--host", host,
                    "--port", port, "--user", username, database, "--execute", query], env=mysql_env,
                    text=True, capture_output=True, timeout=20, check=False)
                if result.returncode:
                    raise RuntimeError("Database operation failed")
                return result.stdout.strip().splitlines() if result.stdout.strip() else []

            state = mysql("SELECT CONCAT(p.status,'|',p.in_progress,'|',COALESCE(p.amount_decimal,p.amount),'|',"
                "p.currency_code,'|',i.paid,'|',i.transaction_in_progress,'|',"
                "COALESCE(i.pending_amount_decimal,i.pending_amount)) FROM pms_payment p "
                "JOIN pms_invoice i ON i.ref=p.bill_reference "
                "WHERE p.id=216 AND p.bill_reference='INV-DE4' LIMIT 1")
            if state != ["verification_failed|\x00|5|KES|\x00|\x00|5"]:
                # MySQL BIT values may render as literal control bytes; compare normalized fields instead.
                fields = state[0].split("|") if state else []
                if len(fields) != 7 or fields[0] != "verification_failed" or fields[2] not in ("5", "5.00") \
                        or fields[3] != "KES" or fields[6] not in ("5", "5.00"):
                    raise RuntimeError("Database state is not eligible for scoped recovery")

            mysql("START TRANSACTION; "
                "UPDATE pms_payment SET in_progress=1,status='initialized',"
                "status_desc='Scoped recovery after fresh Paystack verification' "
                "WHERE id=216 AND bill_reference='INV-DE4' AND status='verification_failed' AND in_progress=0; "
                "UPDATE pms_invoice SET transaction_in_progress=1 "
                "WHERE ref='INV-DE4' AND paid=0 AND pending_amount_decimal=5.00; COMMIT;")

            body = json.dumps({"event": "charge.success", "data": {"reference": reference}}, separators=(",", ":")).encode()
            signature = hmac.new(secret.encode(), body, hashlib.sha512).hexdigest()
            callback = urllib.request.Request("https://app.slickhood.com/api/callback/paystack", data=body,
                headers={"Content-Type": "application/json", "x-paystack-signature": signature}, method="POST")
            with urllib.request.urlopen(callback, timeout=30) as response:
                if response.status != 200:
                    raise RuntimeError("Signed callback was not accepted")

            final = mysql("SELECT CONCAT(p.status,'|',p.in_progress,'|',i.paid,'|',"
                "COALESCE(i.pending_amount_decimal,i.pending_amount)) FROM pms_payment p "
                "JOIN pms_invoice i ON i.ref=p.bill_reference WHERE p.id=216 AND i.ref='INV-DE4'")
            if not final or not final[0].startswith("successful|") or not final[0].endswith("|0.00"):
                raise RuntimeError("Recovery did not reach the required paid state")
            print("Reference 216 securely recovered and invoice INV-DE4 settled")
            PY
